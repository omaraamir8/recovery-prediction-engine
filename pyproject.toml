[project]
name = "recovery-prediction-engine"
version = "0.1.0"
description = "Personal recovery-prediction engine on 100+ days of wearable biometric data — built like a production ML system."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
transform = [
    "dbt-duckdb>=1.9",
]
ml = [
    "scikit-learn>=1.5",
    "mlflow>=2.14",
]
# deep learning — kept separate so the serving image and default env stay lean.
# Install CPU-only (the default CUDA bundle is ~2GB of dead weight without a GPU):
#   uv pip install --python .venv/bin/python torch \
#       --index-url https://download.pytorch.org/whl/cpu
deep = [
    "torch>=2.4",
]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
orchestration = ["dagster>=1.9", "dagster-duckdb>=0.23"]
dev = ["ruff>=0.5", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpe"]

[tool.ruff]
target-version = "py312"
line-length = 100
